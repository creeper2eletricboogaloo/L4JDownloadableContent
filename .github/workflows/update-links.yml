name: Update download links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest scripts.test_update_links
      - run: python scripts/update_links.py --write
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/update-links
          commit-message: Update download links
          title: Update download links
          body: Automated link maintenance.
